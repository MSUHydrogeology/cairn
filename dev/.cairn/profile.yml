# Cairn self-host install-config (authoritative committed profile).
#
# This is the file you EDIT to change the profile; then regenerate the
# lockfile with `python bootstrap/scaffold.py upgrade --init-lock --target .`
# (see BOOTSTRAP.md Act II-2, "Where the profile lives").
#
# Accepted by the Maintainer on 2026-06-12 (Act I-6). The deliberation
# behind it lives in dev/strategy/ (the adoption record).

project_name: "Cairn"
test_command: "python -m pytest bootstrap/tests"
forge: github

# Cairn's own six-axis point: greenfield / medium / moderate / single /
# solo / concurrent-multi-type. That is the `collaborative-team` preset
# with one override (human team is solo, not small-multi).
preset: collaborative-team
human_team: solo

modules_add:
  - issue-capture            # GitHub Issues for gap/friction capture
  - security-review          # real trust boundary: file I/O, path handling, YAML/module parsing
  - examples-gallery         # examples/ ships runnable code; others adopt Cairn
