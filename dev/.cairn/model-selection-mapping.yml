# model-selection tier-to-model mapping (Cairn model-selection module).
#
# Cairn's own mapping, filled by hand on 2026-10-18 at the Maintainer's
# instruction. Re-verify with:
#
#   python scripts/check_model_selection.py
#
# Record schema: dev/modules/model-selection.md > "Mapping-record schema".
# Models are named by family, never by version: each row means the latest
# release of that family (Maintainer, 2026-10-18), so a new version needs no edit.
# These rows bind tiers by name, not by measurement, and each `source` says
# so. Re-rank when `re_verification_trigger` fires.
#
# Model names here are this repository's own configuration under dev/, which
# the vendor-neutrality gate does not scan. The shipped stub and the
# templates stay vendor-neutral.

mapping:
  - tier: high
    model: "Opus"              # Claude (Anthropic), latest release
    date_verified: "2026-10-18"
    task_family: "strategy, research, premise-checking, proposal review, Security Review"
    source: "Maintainer's assignment, 2026-10-18 -- by name, not benchmarked"
    re_verification_trigger: a release that changes which family fits the tier
  - tier: medium
    model: "Sonnet"            # Claude (Anthropic), latest release
    date_verified: "2026-10-18"
    task_family: "proposal authoring, implementation, plan review, code review, routine authoring"
    source: "Maintainer's assignment, 2026-10-18 -- by name, not benchmarked"
    re_verification_trigger: a release that changes which family fits the tier
  - tier: low
    model: "Haiku"             # Claude (Anthropic), latest release
    date_verified: "2026-10-18"
    task_family: "the trivial lane: typos, wording, link fixes, docstring and comment cleanup"
    source: "Maintainer's assignment, 2026-10-18 -- by name, not benchmarked"
    re_verification_trigger: a release that changes which family fits the tier
