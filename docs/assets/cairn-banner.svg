<!--
  cairn-banner.svg — Project identity graphic for the Cairn methodology.
  Motif: stacked stones (a cairn trail marker), evoking a marked path
  for those who come after.

  Provenance: hand-authored SVG; produced for the Cairn README landing-page
  enhancement (proposal 2026-06-08-claude-cairn-readme-landing-page, accepted
  2026-06-09). No raster source; no external tool dependency.

  License: Creative Commons Attribution-NoDerivatives 4.0 International
  (CC BY-ND 4.0) — this is a PROJECT-IDENTITY graphic, so it may be shared
  with attribution but not modified, keeping the identity mark canonical.
  Deed: https://creativecommons.org/licenses/by-nd/4.0/
  (The explanatory diagrams under docs/assets/ are CC BY 4.0; see README > License.)

  Theme-adaptive: uses currentColor for text and stroke; fills draw from
  a prefers-color-scheme media query (stone fills shift between light and
  dark themes so the graphic is legible on both GitHub light and dark).
-->
<svg viewBox="0 0 600 140" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="Cairn — stacked stones trail-marker logo with tagline">
  <style>
    .stone-fill-base { fill: #8a9bb0; }
    .stone-fill-mid  { fill: #6e7f94; }
    .stone-fill-top  { fill: #5a6e82; }
    .stone-stroke    { stroke: currentColor; stroke-opacity: 0.18; fill: none; }
    .label-main      { font-family: ui-monospace, "SFMono-Regular", Menlo,
                       Consolas, "Liberation Mono", monospace;
                       font-size: 36px; font-weight: 700;
                       fill: currentColor; letter-spacing: -1px; }
    .label-tag       { font-family: ui-sans-serif, system-ui, -apple-system,
                       BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                       font-size: 13.5px; fill: currentColor; opacity: 0.65; }
    @media (prefers-color-scheme: dark) {
      .stone-fill-base { fill: #4a5568; }
      .stone-fill-mid  { fill: #68778d; }
      .stone-fill-top  { fill: #8a99ae; }
    }
  </style>

  <!-- Cairn stones: three stacked ellipses suggesting a trail marker -->
  <!-- Bottom stone (widest) -->
  <ellipse cx="72" cy="112" rx="52" ry="14" class="stone-fill-base"/>
  <ellipse cx="72" cy="112" rx="52" ry="14" class="stone-stroke"/>

  <!-- Middle stone -->
  <ellipse cx="72" cy="91"  rx="39" ry="11" class="stone-fill-mid"/>
  <ellipse cx="72" cy="91"  rx="39" ry="11" class="stone-stroke"/>

  <!-- Upper-middle stone -->
  <ellipse cx="72" cy="73"  rx="28" ry="9"  class="stone-fill-base"/>
  <ellipse cx="72" cy="73"  rx="28" ry="9"  class="stone-stroke"/>

  <!-- Top stone (smallest) -->
  <ellipse cx="72" cy="57"  rx="18" ry="7"  class="stone-fill-top"/>
  <ellipse cx="72" cy="57"  rx="18" ry="7"  class="stone-stroke"/>

  <!-- Title text -->
  <text x="148" y="85" class="label-main">Cairn</text>

  <!-- Tagline -->
  <text x="149" y="109" class="label-tag">A trail marker left for those who come after.</text>
  <text x="149" y="126" class="label-tag">Human + AI development · recorded · reviewed · reproducible.</text>
</svg>
