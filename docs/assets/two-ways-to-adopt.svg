<!--
  two-ways-to-adopt.svg - Conceptual diagram: there are two ways into
  Cairn, reading it or installing it, and an install grows by adding
  modules rather than by climbing levels.

  Shown: "Read it" (use the doctrine as a handbook and install nothing)
  beside "Install it" (choose a profile, run the scaffold, then do the four
  steps the installer prints: confirm the installed files, fill the slots,
  run the acceptance gate, and take one change through the lifecycle).
  Below: an install adds modules as the work earns them (examples named:
  testing-discipline, doc-drift-prevention,
  coordination-tiers, dual-review); a profile is a starting point, not a
  rank. Checkable against on-ramp/README.md.

  Provenance: hand-authored SVG, no external tool; produced for the README
  and project-site visuals on the Maintainer's direction, 2026-10-23.

  License: Creative Commons Attribution 4.0 International (CC BY 4.0).
  See LICENSE-CC-BY.md.

  Theme-adaptive: a prefers-color-scheme media query flips the box fills and
  a foreground ink custom property, so the figure reads on light and dark.
-->
<svg viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">Two ways in: read the method, or install it with a profile. An install grows by adding modules as the work earns them, not by climbing levels.</title>
  <desc id="fig-desc">Read it: use the doctrine as a handbook and install nothing. Install it: choose a profile, run the scaffold, then do the four steps the installer prints, which are confirm the files, fill the slots, run the acceptance gate, and take one change through the lifecycle. Afterwards, add modules as the work earns them, for example testing-discipline, doc-drift-prevention, coordination-tiers and dual-review. A profile is a starting point, not a rank.</desc>
  <style>
    svg { --ink: #1f2328; }
    .read    { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.4; }
    .install { fill: #dbeafe; stroke: #3b82f6; stroke-width: 1.4; }
    .step    { fill: #ffffff; stroke: #93c5fd; stroke-width: 1; }
    .module  { fill: #dcfce7; stroke: #22c55e; stroke-width: 1.2; }
    .t { font-family: ui-sans-serif, system-ui, -apple-system,
         BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            fill: var(--ink); font-size: 12px; }
    .title { font-size: 17px; font-weight: 700; }
    .head  { font-size: 15px; font-weight: 700; }
    .body  { font-size: 13px; opacity: 0.85; }
    .num   { font-size: 13px; font-weight: 700; }
    .note  { font-size: 12.5px; font-style: italic; opacity: 0.75; }
    .or    { font-size: 13px; font-weight: 700; opacity: 0.55; }
    .arrow { stroke: var(--ink); stroke-opacity: 0.45; stroke-width: 1.5;
             fill: none; marker-end: url(#a); }
    .head-mark { fill: var(--ink); opacity: 0.45; }
    @media (prefers-color-scheme: dark) {
      svg { --ink: #e6edf3; }
      .read    { fill: #161b22; stroke: #6e7681; }
      .install { fill: #1e3a5f; stroke: #60a5fa; }
      .step    { fill: #0d1117; stroke: #3b82f6; }
      .module  { fill: #14391f; stroke: #4ade80; }
    }
  </style>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0.5 L7,4 L0,7.5 z" class="head-mark"/>
    </marker>
  </defs>

  <text x="340" y="26" text-anchor="middle" class="t title">Two ways in. Start small, and grow by adding modules.</text>

  <!-- Read it -->
  <rect x="20" y="46" width="190" height="150" rx="9" class="read"/>
  <text x="115" y="74" text-anchor="middle" class="t head">Read it</text>
  <text x="115" y="104" text-anchor="middle" class="t body">Use the method</text>
  <text x="115" y="123" text-anchor="middle" class="t body">as a handbook.</text>
  <text x="115" y="152" text-anchor="middle" class="t body">Install nothing;</text>
  <text x="115" y="171" text-anchor="middle" class="t body">change how you work.</text>

  <text x="228" y="126" text-anchor="middle" class="t or">or</text>

  <!-- Install it -->
  <rect x="246" y="46" width="414" height="150" rx="9" class="install"/>
  <text x="453" y="74" text-anchor="middle" class="t head">Install it</text>
  <rect x="262" y="88" width="382" height="28" rx="5" class="step"/>
  <text x="276" y="107" class="t num">1</text>
  <text x="296" y="107" class="t body">Choose a profile for the project</text>
  <rect x="262" y="122" width="382" height="28" rx="5" class="step"/>
  <text x="276" y="141" class="t num">2</text>
  <text x="296" y="141" class="t body">Run the scaffold against your repository</text>
  <rect x="262" y="156" width="382" height="28" rx="5" class="step"/>
  <text x="276" y="175" class="t num">3</text>
  <text x="296" y="175" class="t body">Do the four steps the installer prints</text>

  <!-- Grow -->
  <path d="M453,197 L453,221" class="arrow"/>
  <text x="340" y="242" text-anchor="middle" class="t head">Then add modules as the work earns them</text>
  <rect x="61" y="254" width="140" height="28" rx="14" class="module"/>
  <text x="131" y="273" text-anchor="middle" class="mono">testing-discipline</text>
  <rect x="211" y="254" width="156" height="28" rx="14" class="module"/>
  <text x="289" y="273" text-anchor="middle" class="mono">doc-drift-prevention</text>
  <rect x="377" y="254" width="140" height="28" rx="14" class="module"/>
  <text x="447" y="273" text-anchor="middle" class="mono">coordination-tiers</text>
  <rect x="527" y="254" width="92" height="28" rx="14" class="module"/>
  <text x="573" y="273" text-anchor="middle" class="mono">dual-review</text>

  <text x="340" y="308" text-anchor="middle" class="t note">A profile is a starting point, not a rank: there are no levels to climb.</text>
</svg>
