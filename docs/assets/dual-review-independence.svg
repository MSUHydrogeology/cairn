<!--
  dual-review-independence.svg - Conceptual diagram: Cairn's Dual-Review
  model, one review at every stage, and the distance a reviewer stood from
  the author recorded rather than claimed.

  Shown: the author opens a proposal; a reviewer who did not write the work
  questions its foundations and answers in writing; and, only when the
  maintainer asks, a different model or a person adds more distance.

  Provenance: hand-authored SVG; produced for the Cairn README landing-page
  enhancement (proposal 2026-06-08-claude-cairn-readme-landing-page, accepted
  2026-06-09) and redrawn when the review model became one stance at every
  stage. Faithfully depicts doctrine/dual-review.md.

  License: Creative Commons Attribution 4.0 International (CC BY 4.0).
  See LICENSE-CC-BY.md.

  Theme-adaptive: a prefers-color-scheme media query flips both the box fills
  and a foreground ink custom property (labels, arrows, dividers), so the
  diagram stays legible on GitHub light and dark.  currentColor is avoided:
  it does not adapt in GitHub's img-embedded SVG rendering.
-->
<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">One review at every stage: a reviewer who did not write the work questions its foundations and answers in writing. A different model, or a person, adds more distance whenever the maintainer asks.</title>
  <desc id="fig-desc">One review at every stage: a reviewer who did not write the work questions its foundations and answers in writing. A different model, or a person, adds more distance whenever the maintainer asks. Left to right: the author opens a proposal with an evidence plan; a reviewer who did not write the work reviews it in a fresh session, asking whether it should happen as framed, what the best alternative is and what would show it wrong; a dashed box shows the extra distance a different model or a person gives when the maintainer asks. Below: every review names its reviewer, so how far they stood from the author is on the record.</desc>
  <style>
    /* Foreground "ink": GitHub renders README SVGs in an img/embed context
       where currentColor does NOT inherit the page text color (it falls back
       to black and never adapts to dark mode).  A prefers-color-scheme custom
       property DOES fire, so route every text/stroke through --ink.
       (No literal angle-bracket tags in this style block: SVG style content
       is not CDATA-protected, so a stray one would break XML parsing.) */
    svg { --ink: #1f2328; }
    .box-author   { fill: #dbeafe; stroke: #3b82f6; stroke-width: 1.5; rx: 7; }
    .box-review   { fill: #dcfce7; stroke: #22c55e; stroke-width: 1.5; }
    .box-distance { fill: #fef9c3; stroke: #eab308; stroke-width: 1.5;
                    stroke-dasharray: 5 4; }
    .lbl-head  { font-family: ui-sans-serif, system-ui, -apple-system,
                 BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                 font-size: 12.5px; font-weight: 700; fill: var(--ink); }
    .lbl-body  { font-family: ui-sans-serif, system-ui, -apple-system,
                 BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                 font-size: 11px; fill: var(--ink); opacity: 0.75; }
    .lbl-tag   { font-family: ui-sans-serif, system-ui, -apple-system,
                 BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                 font-size: 10.5px; font-style: italic;
                 fill: var(--ink); opacity: 0.6; }
    .arrow     { stroke: var(--ink); stroke-width: 1.6;
                 stroke-opacity: 0.5; fill: none;
                 marker-end: url(#arr); }
    .arrowhead { fill: var(--ink); opacity: 0.5; }
    .divider   { stroke: var(--ink); stroke-opacity: 0.12; stroke-width: 1; }
    .title     { font-family: ui-sans-serif, system-ui, -apple-system,
                 BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                 font-size: 13.5px; font-weight: 700;
                 fill: var(--ink); }
    @media (prefers-color-scheme: dark) {
      svg { --ink: #e6edf3; }
      .box-author   { fill: #1e3a5f; stroke: #60a5fa; }
      .box-review   { fill: #14391f; stroke: #4ade80; }
      .box-distance { fill: #3b2f07; stroke: #fbbf24; }
    }
  </style>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8"
            refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="320" y="22" text-anchor="middle" class="title">
    Dual-Review - one review at every stage
  </text>

  <!-- Author box -->
  <rect x="20" y="42" width="140" height="70" rx="7"
        class="box-author" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="90" y="64" text-anchor="middle" class="lbl-head">Author</text>
  <text x="90" y="80" text-anchor="middle" class="lbl-body">opens proposal</text>
  <text x="90" y="95" text-anchor="middle" class="lbl-body">with evidence plan</text>

  <!-- Arrow: Author to Review -->
  <path d="M160,77 L230,77" class="arrow"/>

  <!-- Review box -->
  <rect x="230" y="42" width="160" height="88" rx="7"
        class="box-review" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="310" y="64" text-anchor="middle" class="lbl-head">Review</text>
  <text x="310" y="80" text-anchor="middle" class="lbl-body">a reviewer who did not</text>
  <text x="310" y="95" text-anchor="middle" class="lbl-body">write it; fresh session</text>
  <text x="310" y="114" text-anchor="middle" class="lbl-tag">questions its foundations</text>

  <!-- Arrow: Review to more distance (only when asked) -->
  <path d="M390,77 L450,77" class="arrow" stroke-dasharray="4 3"/>

  <!-- More distance box (dashed: only when the maintainer asks) -->
  <rect x="450" y="42" width="170" height="88" rx="7"
        class="box-distance" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"
        stroke-dasharray="5 4"/>
  <text x="535" y="64" text-anchor="middle" class="lbl-head">More distance</text>
  <text x="535" y="80" text-anchor="middle" class="lbl-body">a different model</text>
  <text x="535" y="95" text-anchor="middle" class="lbl-body">or a person</text>
  <text x="535" y="114" text-anchor="middle" class="lbl-tag">whenever the maintainer asks</text>

  <!-- Divider -->
  <line x1="20" y1="158" x2="620" y2="158" class="divider"/>

  <!-- Record note row -->
  <text x="320" y="180" text-anchor="middle" class="lbl-head">
    Why the record names the reviewer
  </text>
  <text x="320" y="198" text-anchor="middle" class="lbl-body">
    Independence is recorded, not claimed: every review names its reviewer,
  </text>
  <text x="320" y="214" text-anchor="middle" class="lbl-body">
    so how far they stood from the author is on the record.  Solo team?
  </text>
  <text x="320" y="230" text-anchor="middle" class="lbl-body">
    A fresh session reviews at every stage; more distance is there
  </text>
  <text x="320" y="246" text-anchor="middle" class="lbl-body">
    whenever you ask for it.
  </text>
</svg>
